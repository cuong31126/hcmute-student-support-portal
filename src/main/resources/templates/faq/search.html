<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Tra Cứu Câu Hỏi Thường Gặp (FAQ) - QAUTE Portal</title>
</head>
<body>
<div th:fragment="content">
    
    <!-- Title Section -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="fw-bold text-dark mb-1">Tra Cứu Câu Hỏi Thường Gặp (FAQ)</h4>
            <p class="small text-muted mb-0">Bộ dữ liệu gồm hơn 2.600+ câu hỏi và giải đáp học vụ chính thức từ HCMUTE</p>
        </div>
        <a th:href="@{/tickets/create}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-circle me-1"></i>Không tìm thấy? Gửi Ticket
        </a>
    </div>

    <!-- Live Search Input -->
    <div class="card p-3 mb-4">
        <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="faqSearchInput" th:value="${query}" class="form-control border-start-0 ps-0 shadow-none" placeholder="Nhập từ khóa cần hỏi (VD: nộp chứng chỉ tiếng anh, miễn thi, phúc khảo điểm, học phí...)">
            <button class="btn btn-primary" type="button" id="btnExecuteSearch">Tìm Kiếm</button>
        </div>
    </div>

    <!-- FAQ Results Container -->
    <div id="faqResultsContainer" class="accordion shadow-sm">
        <div th:each="faq, iter : ${faqs}" class="accordion-item">
            <h2 class="accordion-header" th:id="'heading' + ${iter.index}">
                <button class="accordion-button collapsed fw-semibold text-dark" type="button" data-bs-toggle="collapse" th:data-bs-target="'#collapse' + ${iter.index}" aria-expanded="false" th:aria-controls="'#collapse' + ${iter.index}">
                    <span class="badge bg-primary bg-opacity-10 text-primary me-2" th:text="${faq.department.name}">Đơn vị</span>
                    <span th:text="${faq.question}">Câu hỏi</span>
                </button>
            </h2>
            <div th:id="'collapse' + ${iter.index}" class="accordion-collapse collapse" th:aria-labelledby="'heading' + ${iter.index}" data-bs-parent="#faqResultsContainer">
                <div class="accordion-body bg-light text-secondary">
                    <p class="mb-2 fw-medium text-dark">Lời giải đáp từ Ban Tư Vấn:</p>
                    <div class="bg-white p-3 rounded border text-dark" style="white-space: pre-line;" th:text="${faq.answer}">
                        Nội dung trả lời
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Dynamic Search Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('faqSearchInput');
            const btn = document.getElementById('btnExecuteSearch');
            const container = document.getElementById('faqResultsContainer');

            function doSearch() {
                const q = input.value.trim();
                if (!q) return;

                fetch(`/api/v1/faqs/match?q=${encodeURIComponent(q)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success && data.data) {
                            if (data.data.length === 0) {
                                container.innerHTML = `
                                    <div class="card p-4 text-center text-muted">
                                        <i class="bi bi-info-circle fs-2 text-warning mb-2"></i>
                                        <p class="mb-2">Không tìm thấy câu trả lời khớp với từ khóa "<strong>${q}</strong>".</p>
                                        <div><a href="/tickets/create?title=${encodeURIComponent(q)}" class="btn btn-outline-primary btn-sm">Tạo Ticket gửi Cán bộ chuyên môn ngay</a></div>
                                    </div>
                                `;
                                return;
                            }

                            let html = '';
                            data.data.forEach((item, idx) => {
                                html += `
                                    <div class="accordion-item mb-2 border rounded overflow-hidden">
                                        <h2 class="accordion-header" id="dynHeading${idx}">
                                            <button class="accordion-button collapsed fw-semibold text-dark" type="button" data-bs-toggle="collapse" data-bs-target="#dynCollapse${idx}">
                                                <span class="badge bg-success bg-opacity-10 text-success me-2">${Math.round(item.confidenceScore * 100)}% Khớp</span>
                                                <span class="badge bg-primary bg-opacity-10 text-primary me-2">${item.departmentName}</span>
                                                <span>${item.question}</span>
                                            </button>
                                        </h2>
                                        <div id="dynCollapse${idx}" class="accordion-collapse collapse" data-bs-parent="#faqResultsContainer">
                                            <div class="accordion-body bg-light text-secondary">
                                                <p class="mb-2 fw-medium text-dark">Lời giải đáp từ Ban Tư Vấn:</p>
                                                <div class="bg-white p-3 rounded border text-dark" style="white-space: pre-line;">
                                                    ${item.answer}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            });
                            container.innerHTML = html;
                        }
                    });
            }

            btn.addEventListener('click', doSearch);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') doSearch();
            });

            // Nếu URL có query ban đầu thì tự search
            if (input.value.trim()) {
                doSearch();
            }
        });
    </script>
</div>
</body>
</html>
