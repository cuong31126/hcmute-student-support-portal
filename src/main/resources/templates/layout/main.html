<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">QAUTE Portal - Cổng Tư Vấn Sinh Viên HCMUTE</title>

    <!-- Favicon: Logo HCMUTE -->
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">

    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Academic CSS Rules -->
    <style>
        :root {
            --crimson: #A51C30;
            --dark-crimson: #8a1525;
            --light-crimson: #fdf2f4;
            --bs-primary: #1E3A8A;
            --bs-primary-rgb: 30, 58, 138;
            --bs-body-font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --bs-body-bg: #f8f9fa;
            --bs-body-color: #111827;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--bs-body-font-family);
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            overflow-x: hidden;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .card {
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-radius: 8px;
        }
        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: #172554;
            border-color: #172554;
        }
        .btn-outline-primary {
            color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-outline-primary:hover {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
            color: #ffffff;
        }
        .text-crimson {
            color: var(--crimson) !important;
        }
        .bg-crimson {
            background-color: var(--crimson) !important;
        }
        .table {
            --bs-table-bg: transparent;
            font-size: 0.925rem;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <!-- Main Content Container -->
    <main class="flex-grow-1 py-4">
        <div class="container">
            <!-- Flash Success Message -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Flash Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Page Specific Content -->
            <div th:replace="${content}"></div>
        </div>
    </main>

    <!-- Chatbot Widget -->
    <div th:replace="~{ai/chat-widget :: chat-widget}"></div>

    <!-- Footer -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
