<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1e3a8a;">
    <div class="container">
        <!-- Logo & Brand Name -->
        <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/}">
            <span class="badge bg-danger me-2 px-2 py-1 fs-6">QAUTE</span>
            <span>Cổng Tư Vấn Sinh Viên</span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Trang Chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/faqs}"><i class="bi bi-search me-1"></i>Tra Cứu FAQ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tickets/create}"><i class="bi bi-ticket-perforated me-1"></i>Gửi Yêu Cầu</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/tickets/my-tickets}"><i class="bi bi-journal-text me-1"></i>Ticket Của Tôi</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STAFF')">
                    <a class="nav-link fw-semibold text-warning" th:href="@{/staff/tickets}"><i class="bi bi-kanban me-1"></i>Bàn Xử Lý Staff</a>
                </li>
            </ul>

            <!-- Auth Controls -->
            <div class="d-flex align-items-center">
                <!-- Guest / Not Logged In -->
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a class="btn btn-outline-light btn-sm px-3" th:href="@{/auth/login}">Đăng Nhập</a>
                    <a class="btn btn-light btn-sm px-3 text-primary fw-semibold" th:href="@{/auth/register}">Đăng Ký</a>
                </div>

                <!-- Logged In User -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1 fs-6"></i>
                        <span sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userDropdown">
                        <li><h6 class="dropdown-header" sec:authentication="name">Tài khoản</h6></li>
                        <li sec:authorize="hasRole('STAFF')">
                            <a class="dropdown-item" th:href="@{/staff/tickets}"><i class="bi bi-speedometer2 me-2"></i>Dashboard Quản lý</a>
                        </li>
                        <li sec:authorize="hasRole('STUDENT')">
                            <a class="dropdown-item" th:href="@{/tickets/my-tickets}"><i class="bi bi-list-check me-2"></i>Danh sách Ticket</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
