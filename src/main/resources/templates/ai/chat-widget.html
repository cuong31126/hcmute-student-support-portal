<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="chat-widget">
    <!-- Floating Button -->
    <button id="btn-open-ai-chat" class="btn btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center"
            style="position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; z-index: 1050; background-color: #1e3a8a; border: none;"
            title="Mở Trợ lý AI Tư Vấn">
        <i class="bi bi-chat-dots-fill fs-4 text-white"></i>
    </button>

    <!-- Chat Box Container (Floating Window) -->
    <div id="ai-chat-box" class="card shadow-lg border-0 d-none"
         style="position: fixed; bottom: 95px; right: 25px; width: 380px; height: 500px; z-index: 1050; border-radius: 12px; overflow: hidden;">
        
        <!-- Header -->
        <div class="card-header text-white d-flex align-items-center justify-content-between py-2 px-3" style="background-color: #1e3a8a;">
            <div class="d-flex align-items-center">
                <i class="bi bi-robot me-2 fs-5"></i>
                <div>
                    <h6 class="mb-0 fw-bold">Trợ Lý AI Học Vụ 24/7</h6>
                    <small class="text-white-50" style="font-size: 11px;">Tra cứu tri thức & Hỗ trợ tạo Ticket</small>
                </div>
            </div>
            <button type="button" id="btn-close-ai-chat" class="btn-close btn-close-white" aria-label="Close"></button>
        </div>

        <!-- Chat Messages Container -->
        <div id="ai-chat-messages" class="card-body p-3 overflow-auto" style="background-color: #f8f9fa; height: 375px;">
            <div class="d-flex mb-3">
                <div class="rounded p-2 text-dark bg-white border shadow-sm small" style="max-width: 85%;">
                    👋 Xin chào! Tôi là Trợ lý AI của trường. Bạn có câu hỏi nào về <strong>Quy chế học vụ, Nộp chứng chỉ tiếng Anh, Điểm thi, Học phí hay Đăng ký môn học</strong> không?
                </div>
            </div>
        </div>

        <!-- Chat Input Footer -->
        <div class="card-footer bg-white p-2 border-top">
            <div class="input-group input-group-sm">
                <input type="text" id="ai-chat-input" class="form-control" placeholder="Nhập câu hỏi của bạn..." autocomplete="off">
                <button class="btn btn-primary px-3" id="btn-send-ai-message" type="button" style="background-color: #1e3a8a;">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Script điều khiển Chatbot & Đối soát FAQ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnOpen = document.getElementById('btn-open-ai-chat');
            const btnClose = document.getElementById('btn-close-ai-chat');
            const chatBox = document.getElementById('ai-chat-box');
            const chatInput = document.getElementById('ai-chat-input');
            const btnSend = document.getElementById('btn-send-ai-message');
            const messagesContainer = document.getElementById('ai-chat-messages');

            if (btnOpen && chatBox) {
                btnOpen.addEventListener('click', () => {
                    chatBox.classList.toggle('d-none');
                    if (!chatBox.classList.contains('d-none')) {
                        chatInput.focus();
                    }
                });
                btnClose.addEventListener('click', () => chatBox.classList.add('d-none'));

                btnSend.addEventListener('click', handleUserQuery);
                chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleUserQuery();
                });
            }

            function handleUserQuery() {
                const query = chatInput.value.trim();
                if (!query) return;

                // 1. Render tin nhắn User
                appendMessage('user', escapeHtml(query));
                chatInput.value = '';

                // 2. Loading indicator
                const loadingId = 'ai-loading-' + Date.now();
                appendLoading(loadingId);

                // 3. Đấu nối sang REST API AI RAG thực sự
                fetch('/api/v1/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: query })
                })
                .then(res => {
                    if (!res.ok) throw new Error('Network error: ' + res.status);
                    return res.json();
                })
                .then(res => {
                    removeLoading(loadingId);
                    if (res.success && res.data) {
                        const ragData = res.data;
                        let rawAnswer = ragData.answer || 'Xin chào! Tôi đã tiếp nhận câu hỏi của bạn.';
                        let answerHtml = '';

                        // Hiển thị Banner cảnh báo lịch sử nếu rơi vào Tầng 2
                        if (ragData.needsHistoricalWarning) {
                            answerHtml += `
                                <div class="alert alert-warning py-1 px-2 mb-2 small d-flex align-items-center rounded" style="font-size: 11px; background-color: #fffbeb; border-color: #fde68a; color: #92400e;">
                                    <i class="bi bi-clock-history me-2 fs-6 text-warning"></i>
                                    <div><strong>Dữ liệu tham khảo lịch sử:</strong> Nội dung dựa trên cơ sở dữ liệu các năm trước. Vui lòng đối chiếu quy chế 2026.</div>
                                </div>
                            `;
                        }

                        // Định dạng nội dung câu trả lời
                        answerHtml += `<div class="ai-text-content">${formatAiResponse(rawAnswer)}</div>`;

                        // Hiển thị nguồn tài liệu trích dẫn từ kho RAG
                        if (ragData.matchedChunks && ragData.matchedChunks.length > 0) {
                            answerHtml += `<div class="mt-2 pt-2 border-top"><small class="text-muted fw-bold d-block mb-1" style="font-size: 11px;"><i class="bi bi-journal-bookmark me-1"></i>Nguồn tài liệu quy chế đối chiếu:</small><div class="d-flex flex-wrap gap-1">`;
                            ragData.matchedChunks.slice(0, 3).forEach(chunk => {
                                const isReg = chunk.sourceType === 'REGULATION';
                                const badgeClass = isReg ? 'bg-primary-subtle text-primary border-primary' : 'bg-light text-secondary border';
                                const icon = isReg ? '📜' : '💬';
                                const dept = chunk.departmentName ? ` [${chunk.departmentName}]` : '';
                                answerHtml += `
                                    <span class="badge ${badgeClass} border text-wrap text-start p-1" style="font-size: 10px; font-weight: normal; max-width: 100%;">
                                        ${icon} ${chunk.title || 'Quy chế học vụ'} (Năm ${chunk.effectiveYear || '2026'})${dept}
                                    </span>
                                `;
                            });
                            answerHtml += `</div></div>`;
                        }

                        // Tùy chọn chuyển tiếp thành Ticket hỗ trợ
                        answerHtml += `
                            <div class="mt-2 pt-2 border-top">
                                <a href="/tickets/create?title=${encodeURIComponent(query)}" class="btn btn-outline-primary btn-sm w-100" style="font-size: 11px;">
                                    <i class="bi bi-envelope-plus me-1"></i>Chưa thỏa đáng? Gửi câu hỏi này thành Ticket tới Cán bộ
                                </a>
                            </div>
                        `;

                        appendMessage('ai', answerHtml);
                    } else {
                        // Fallback khi không có data
                        appendMessage('ai', `
                            Dạ hiện tại AI chưa tìm thấy quy chế trực tiếp tương ứng trong hệ thống.<br><br>
                            <a href="/tickets/create?title=${encodeURIComponent(query)}" class="btn btn-primary btn-sm w-100" style="background-color: #1e3a8a;">
                                <i class="bi bi-ticket-perforated me-1"></i>Tạo Ticket gửi Ban Tư Vấn Học Vụ
                            </a>
                        `);
                    }
                })
                .catch(err => {
                    removeLoading(loadingId);
                    console.error('AI Chat Error:', err);
                    appendMessage('ai', 'Có sự cố kết nối tới máy chủ tri thức AI. Bạn có thể nhấn <a href="/tickets/create">Gửi yêu cầu trực tiếp</a> để Cán bộ hỗ trợ nhé!');
                });
            }

            function escapeHtml(text) {
                if (!text) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            function formatAiResponse(text) {
                if (!text) return '';
                // Bỏ câu cảnh báo trùng nếu Gemini đã đính kèm text tương tự ở đầu
                let cleaned = text.replace(/⚠️\s*\*\*Lưu ý:\*\*[\s\S]*?\n\n/, '');
                let formatted = escapeHtml(cleaned)
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n\n/g, '<br><br>')
                    .replace(/\n/g, '<br>');
                return formatted;
            }

            function appendMessage(sender, htmlContent) {
                const div = document.createElement('div');
                div.className = sender === 'user' ? 'd-flex justify-content-end mb-2' : 'd-flex mb-2';
                const bubble = document.createElement('div');
                bubble.className = sender === 'user' 
                    ? 'rounded p-2 text-white bg-primary small shadow-sm' 
                    : 'rounded p-2 text-dark bg-white border small shadow-sm ai-message-bubble';
                bubble.style.maxWidth = '85%';
                if (sender === 'user') bubble.style.backgroundColor = '#1e3a8a';
                bubble.innerHTML = htmlContent;
                div.appendChild(bubble);
                messagesContainer.appendChild(div);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function appendLoading(id) {
                const div = document.createElement('div');
                div.id = id;
                div.className = 'd-flex mb-2 text-muted small fst-italic';
                div.innerHTML = '<div class="spinner-border spinner-border-sm me-2" role="status"></div>AI đang tra cứu quy chế...';
                messagesContainer.appendChild(div);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function removeLoading(id) {
                const elem = document.getElementById(id);
                if (elem) elem.remove();
            }
        });
    </script>
</div>
</body>
</html>
