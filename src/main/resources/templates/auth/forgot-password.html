<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi Phục Mật Khẩu - QAUTE Portal</title>

    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #111827;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .auth-card {
            max-width: 460px;
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        .btn-auth-submit {
            background-color: #111827;
            border-color: #111827;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.25s ease;
        }
        .btn-auth-submit:hover {
            background-color: #1f2937;
            border-color: #1f2937;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(17, 24, 39, 0.2);
        }
        .otp-input {
            letter-spacing: 6px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="auth-card p-4 p-md-5">
    <!-- Header & Logo -->
    <div class="text-center mb-4">
        <a th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="HCMUTE" height="60" class="mb-3">
        </a>
        <h4 class="fw-bold text-dark font-serif mb-1">Khôi Phục Mật Khẩu</h4>
        <p class="small text-muted mb-0">Xác thực mã OTP gửi về hòm thư Gmail của bạn</p>
    </div>

    <!-- Alert Messages -->
    <div th:if="${errorMessage}" class="alert alert-danger small py-2 px-3 d-flex align-items-center mb-3 rounded-2 shadow-xs">
        <i class="bi bi-exclamation-circle-fill me-2 fs-6 text-danger"></i>
        <div th:text="${errorMessage}">Lỗi xảy ra</div>
    </div>
    <div th:if="${successMessage}" class="alert alert-success small py-2 px-3 d-flex align-items-center mb-3 rounded-2 shadow-xs">
        <i class="bi bi-check-circle-fill me-2 fs-6 text-success"></i>
        <div th:text="${successMessage}">Thành công</div>
    </div>

    <!-- BƯỚC 1: NHẬP EMAIL ĐỂ NHẬN MÃ OTP -->
    <form th:if="${step == null or step == 1}" th:action="@{/auth/forgot-password/send-otp}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label for="email" class="form-label small fw-bold text-dark">Email đăng ký tài khoản</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" name="email" th:value="${email}" class="form-control" placeholder="VD: 21110001@student.hcmute.edu.vn" required autofocus>
            </div>
            <small class="text-muted" style="font-size: 0.75rem;">Mã OTP 6 chữ số sẽ được gửi ngay đến email này.</small>
        </div>

        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-auth-submit">
                <i class="bi bi-send-fill me-1"></i>Gửi Mã OTP Xác Thực
            </button>
        </div>
    </form>

    <!-- BƯỚC 2: NHẬP OTP & ĐẶT MẬT KHẨU MỚI -->
    <form th:if="${step == 2}" th:action="@{/auth/forgot-password/reset}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="email" th:value="${email}" />

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-bold text-dark mb-0">Mã OTP (6 chữ số)</label>
                <small class="text-muted"><span th:text="${email}"></span></small>
            </div>
            <input type="text" id="otpCode" name="otpCode" class="form-control otp-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus>
            <small class="text-muted" style="font-size: 0.75rem;">Mã có hiệu lực trong 5 phút. Vui lòng kiểm tra hòm thư đến/Spam.</small>
        </div>

        <div class="mb-3">
            <label for="newPassword" class="form-label small fw-bold text-dark">Mật khẩu mới</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
            </div>
        </div>

        <div class="mb-4">
            <label for="confirmPassword" class="form-label small fw-bold text-dark">Xác nhận mật khẩu mới</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-check-circle"></i></span>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" minlength="6" required>
            </div>
        </div>

        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-auth-submit">
                <i class="bi bi-shield-check me-1"></i>Đổi Mật Khẩu & Đăng Nhập
            </button>
        </div>

        <div class="text-center">
            <a th:href="@{'/auth/forgot-password?step=1&email=' + ${email}}" class="small text-muted text-decoration-none">
                <i class="bi bi-arrow-repeat me-1"></i>Chưa nhận được mã? Gửi lại OTP
            </a>
        </div>
    </form>

    <!-- Footer link -->
    <div class="text-center small border-top pt-3 mt-3 text-muted">
        Nhớ mật khẩu? <a th:href="@{/auth/login}" class="fw-bold text-dark text-decoration-none">Đăng nhập ngay</a>
    </div>
</div>

</body>
</html>
