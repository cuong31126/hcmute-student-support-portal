<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Đăng Nhập - HCMUTE QAUTE Portal</title>
</head>
<body>
<div th:fragment="content">
    <style>
        .login-hero-bg {
            background-image: linear-gradient(135deg, rgba(138, 21, 37, 0.88) 0%, rgba(20, 24, 33, 0.88) 100%), url('/images/hero1.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            padding: 3rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .login-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.05);
            animation: loginCardFade 0.6s ease-out;
        }
        @keyframes loginCardFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-control:focus {
            border-color: var(--crimson);
            box-shadow: 0 0 0 0.25rem rgba(165, 28, 48, 0.15);
        }
    </style>

    <div class="login-hero-bg">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5 col-xl-4">
                <div class="login-card p-4 p-md-5">
                    <!-- Brand & Logo -->
                    <div class="text-center mb-4">
                        <img th:src="@{/images/logo.png}" alt="HCMUTE" height="60" class="mb-2">
                        <h4 class="fw-bold text-dark font-serif mb-1">HCMUTE PORTAL</h4>
                        <div class="badge bg-danger bg-opacity-10 text-crimson px-3 py-1 rounded-pill fw-semibold small mb-2">
                            Cổng Tư Vấn Sinh Viên QAUTE
                        </div>
                        <p class="small text-muted mb-0">Đăng nhập tài khoản Sinh viên hoặc Cán bộ</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${param.error}" class="alert alert-danger small py-2 d-flex align-items-center mb-3">
                        <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                        <span>Tên đăng nhập hoặc mật khẩu không chính xác!</span>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info small py-2 d-flex align-items-center mb-3">
                        <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                        <span>Đã đăng xuất thành công khỏi hệ thống.</span>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-bold text-secondary">Tên đăng nhập / Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" name="username" class="form-control border-start-0 ps-0" placeholder="VD: 21110001 hoặc email..." required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-bold text-secondary">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary fw-bold py-2 shadow-xs" style="background-color: var(--crimson); border-color: var(--crimson);">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
                            </button>
                        </div>
                    </form>

                    <div class="text-center small border-top pt-3 text-muted">
                        Chưa có tài khoản sinh viên? <a th:href="@{/auth/register}" class="fw-bold text-crimson text-decoration-none">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
