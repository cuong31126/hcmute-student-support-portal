name: Java Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Package Spring Boot
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn về máy ảo CI
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Cài đặt Java 17 kèm Caching Maven (.m2) tăng tốc độ build
      - name: Set up JDK 17 with Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Biên dịch và Đóng gói file JAR
      - name: Compile & Package JAR with Maven
        run: |
          echo "========================================="
          echo "Bắt đầu kiểm tra và đóng gói dự án Maven..."
          echo "========================================="
          mvn -B clean compile test-compile package -DskipTests
        env:
          MAVEN_OPTS: "-Xmx1024m"

      # 4. Lưu trữ file Artifact JAR để tải về hoặc triển khai
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qaute-portal-build
          path: target/*.jar
          if-no-files-found: ignore
          retention-days: 7