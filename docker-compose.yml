version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qaute-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: qaute_portal
      MYSQL_ROOT_PASSWORD: RootPassword123@
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - qaute-network

  app:
    image: lecuong31126/qaute-portal:latest
    container_name: qaute-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qaute_portal?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: RootPassword123@
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - mysql
    networks:
      - qaute-network

volumes:
  mysql_data:
    external: true

networks:
  qaute-network:
    driver: bridge
